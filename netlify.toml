[build]
  command = "npm run build"
  publish = "dist"

# Long-cache hashed assets; keep HTML fresh so updates show at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Send visitors on the old Netlify address to the custom domain.
[[redirects]]
  from = "https://asadsahto.netlify.app/*"
  to = "https://asadsaleem.tech/:splat"
  status = 301
  force = true
