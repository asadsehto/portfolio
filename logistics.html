<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wowza Live Logistics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0;
            font-weight: 600;
            font-size: 22px;
            color: var(--primary);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #stats-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .map-container {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .channel-card-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .channel-card.selected {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.12);
        }

        .v-count {
            color: var(--primary);
            font-weight: 600;
            font-size: 18px;
        }

        .partner-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            display: none;
        }

        .channel-card.selected .partner-list {
            display: block;
        }

        .partner-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            color: #94a3b8;
        }

        .partner-row span:last-child {
            color: var(--text);
            font-weight: 600;
        }

        .leaflet-container {
            background: #0f172a !important;
        }

        .leaflet-tooltip {
            background: #1e293b !important;
            border: 1px solid var(--primary) !important;
            color: #fff !important;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>Wowza Partner Logistics</h1>
                <p id="server-status" style="font-size: 12px; color: #94a3b8; margin: 4px 0 0 0;">Initializing...</p>
            </div>
            <div id="summary-badge"
                style="background: rgba(0, 210, 255, 0.1); padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid var(--primary);">
                0 Viewers | 0 Cities
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="sidebar">
                <div class="sidebar-header">CHANNELS & PARTNERS</div>
                <div id="stats-list"></div>
            </div>
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const CONFIG = {
            wowza_ip: 'localhost',
            wowza_port: '8087',
            wowza_user: 'miamitv',
            wowza_pass: 'ilovemiamitv1953'
        };

        const map = L.map('map', { center: [20, 0], zoom: 2.5, zoomControl: false });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let markers = [];
        let geoCache = {};
        let selectedChannel = null;

        async function updateDashboard() {
            const statsList = document.getElementById('stats-list');
            const summaryBadge = document.getElementById('summary-badge');
            const statusText = document.getElementById('server-status');

            try {
                const fbRes = await fetch('wowza_proxy.php');
                if (!fbRes.ok) throw new Error("Proxy unreachable");

                const text = await fbRes.text();
                const xmlDoc = new DOMParser().parseFromString(text, "text/xml");

                const realViewers = [];
                const channelData = {}; // Stores { count: 0, partners: { 'p1': 10 } }

                const allSessionTags = ['HTTPSession', 'Client', 'RTSPSession'];

                allSessionTags.forEach(tagName => {
                    const tags = xmlDoc.getElementsByTagName(tagName);
                    for (let t of tags) {
                        let ip = t.getAttribute("ip") ||
                            t.getElementsByTagName("IpAddress")[0]?.textContent ||
                            t.getElementsByTagName("Ip")[0]?.textContent;

                        if (ip && !ip.startsWith('127.')) {
                            // 1. Find App Name (channel)
                            let appName = "Direct Feed";
                            let parent = t.parentElement;
                            while (parent) {
                                if (parent.tagName === "Application") {
                                    appName = parent.getAttribute("name") || parent.getElementsByTagName("Name")[0]?.textContent || appName;
                                    break;
                                }
                                parent = parent.parentElement;
                            }
                            if (appName === "_defaultApp_") appName = "Main Feed";

                            // 2. Find Partner/Stream Name
                            let partnerName = "Direct";

                            // Check URI (e.g., smil:VIVA/playlist.m3u8)
                            const uriNode = t.getElementsByTagName("URI")[0];
                            if (uriNode) {
                                const uri = uriNode.textContent;
                                if (uri.includes("smil:")) {
                                    partnerName = uri.split("smil:")[1].split("/")[0].replace(".smil", "");
                                } else if (uri.includes("stream=")) {
                                    partnerName = uri.split("stream=")[1].split("&")[0];
                                }
                            }

                            // Check Stream Name tag (RTMP/Other)
                            if (partnerName === "Direct") {
                                let streamNode = t.parentElement;
                                if (streamNode && streamNode.tagName === "Stream") {
                                    partnerName = streamNode.getElementsByTagName("Name")[0]?.textContent || partnerName;
                                }
                            }

                            realViewers.push({ ip: ip, app: appName, partner: partnerName });

                            // Aggregate Logic
                            if (!channelData[appName]) channelData[appName] = { count: 0, partners: {} };
                            channelData[appName].count++;
                            channelData[appName].partners[partnerName] = (channelData[appName].partners[partnerName] || 0) + 1;
                        }
                    }
                });

                // UI Rendering
                statsList.innerHTML = '';

                // Global Card
                const totalConnections = realViewers.length;
                const allCard = document.createElement('div');
                allCard.className = `channel-card ${!selectedChannel ? 'selected' : ''}`;
                allCard.innerHTML = `<div class="channel-card-header"><div><div style="font-weight:600">Global Overview</div><div style="font-size:12px; color:#94a3b8">All Partners</div></div><span class="v-count">${totalConnections}</span></div>`;
                allCard.onclick = (e) => {
                    if (selectedChannel) { selectedChannel = null; updateDashboard(); }
                };
                statsList.appendChild(allCard);

                // Channel Cards with Partner Breakdown
                Object.entries(channelData)
                    .sort((a, b) => b[1].count - a[1].count)
                    .forEach(([name, data]) => {
                        const card = document.createElement('div');
                        card.className = `channel-card ${selectedChannel === name ? 'selected' : ''}`;

                        // Sort partners by count
                        const sortedPartners = Object.entries(data.partners).sort((a, b) => b[1] - a[1]);
                        const partnerHtml = sortedPartners.map(([pName, pCount]) =>
                            `<div class="partner-row"><span>${pName}</span><span>${pCount}</span></div>`
                        ).join('');

                        card.innerHTML = `
                            <div class="channel-card-header">
                                <div>
                                    <div style="font-weight:600">${name}</div>
                                    <div style="font-size:12px; color:#94a3b8">${sortedPartners.length} Partner(s)</div>
                                </div>
                                <span class="v-count">${data.count}</span>
                            </div>
                            <div class="partner-list">${partnerHtml}</div>
                        `;

                        card.onclick = (e) => {
                            // Don't toggle if clicking the header only, verify interaction
                            selectedChannel = (selectedChannel === name) ? null : name;
                            updateDashboard();
                        };
                        statsList.appendChild(card);
                    });

                const filtered = selectedChannel ? realViewers.filter(v => v.app === selectedChannel) : realViewers;
                const uniqueLocs = [...new Set(filtered.map(v => v.ip))].length;

                summaryBadge.innerText = `${totalConnections} Viewers | ${uniqueLocs} Cities`;
                statusText.innerText = selectedChannel ? `Viewing: ${selectedChannel}` : "Monitoring All Partners";

                await plotData(filtered);

            } catch (error) {
                console.error("Dashboard Error:", error);
                statusText.innerText = "Waiting for data...";
            }
        }

        async function plotData(vList) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (vList.length === 0) return;

            const ipsToGeocode = [...new Set(vList.map(v => v.ip))].filter(ip => !geoCache[ip]);
            for (let i = 0; i < Math.min(ipsToGeocode.length, 10); i++) {
                const ip = ipsToGeocode[i];
                try {
                    const res = await fetch(`http://ip-api.com/json/${ip}`);
                    const data = await res.json();
                    if (data.status === 'success') {
                        geoCache[ip] = { lat: data.lat, lon: data.lon, city: data.city };
                    }
                } catch (e) { }
            }

            const points = {};
            vList.forEach(v => {
                const geo = geoCache[v.ip];
                if (geo) {
                    const key = `${geo.lat}_${geo.lon}`;
                    if (!points[key]) points[key] = { lat: geo.lat, lon: geo.lon, city: geo.city, detail: {} };

                    // Group by Partner if channel is selected, else by App
                    const labelKey = selectedChannel ? `${v.partner}` : `${v.app}`;
                    points[key].detail[labelKey] = (points[key].detail[labelKey] || 0) + 1;
                }
            });

            Object.values(points).forEach(p => {
                const totalAtLoc = Object.values(p.detail).reduce((a, b) => a + b, 0);
                const marker = L.circleMarker([p.lat, p.lon], {
                    radius: 7 + Math.min(totalAtLoc, 15),
                    fillColor: selectedChannel ? "#f59e0b" : "#00d2ff",
                    color: "#fff", weight: 2, fillOpacity: 0.9
                }).addTo(map);

                let label = `<b>${p.city}</b><br>`;
                Object.entries(p.detail).forEach(([k, c]) => {
                    label += `${k}: ${c}<br>`; //////// Shows Partner Name in tooltip///////\\\\\\\\/////
                });

                marker.bindTooltip(label, { direction: 'top', offset: [0, -5] });
                marker.bindPopup(label);
                markers.push(marker);
            });
        }

        setInterval(updateDashboard, 60000); // 1-Minute Refresh
        updateDashboard();
    </script>
</body>

</html>
